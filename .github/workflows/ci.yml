name: CI & Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install linter
        run: pip install ruff
      - name: Lint with Ruff
        run: ruff check .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  secret-security-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full commit history required for secret scanning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository history for leaked secrets
        run: |
          python -m secretscanner . \
            --fail-on CRITICAL \
            --json scan-report.json \
            --html scan-report.html \
            --sarif scan-report.sarif
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: |
            scan-report.json
            scan-report.html
            scan-report.sarif
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scan-report.sarif
        continue-on-error: true
